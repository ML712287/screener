name: Update Screener

on:
  schedule:
    - cron: '0 0,12 * * *'      # UTC 0點同12點（約香港朝8點、夜晚8點）
  workflow_dispatch:             # 可以手動撳 Run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch news
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python fetch_news.py

      - run: python screener_offline.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.html news.json
          git diff --staged --quiet || git commit -m "Auto-update report+news"
          git push

      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add report.html
        git diff --staged --quiet || git commit -m "Auto-update report.html"
        git push
